name: Android build (signed AAB / debug APK)
run-name: "Android • ${{ inputs.target }} • ${{ inputs.ref || github.ref_name }}"

on:
  workflow_dispatch:
    inputs:
      target:
        description: "What to build"
        type: choice
        required: true
        default: release_aab
        options:
        - release_aab
        - release_apk
        - debug_apk
      ref:
        description: "Git ref (branch/tag/sha)"
        required: false
        default: "main"

permissions:
  contents: write

jobs:
  build:
    name: "Build (${{ inputs.target }})"
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.ref }}
        submodules: recursive
        fetch-depth: 0

    # The source import copied .gitmodules but did not preserve the gitlink entries.
    # Clone the two native build dependencies explicitly so CMake can find their sources.
    - name: Fetch native submodule sources
      shell: bash
      run: |
        set -euo pipefail
        git clone --depth 1 https://github.com/amnezia-vpn/amneziawg-tools.git tunnel/tools/amneziawg-tools
        git clone --depth 1 https://github.com/termux/termux-elf-cleaner.git tunnel/tools/elf-cleaner
        test -f tunnel/tools/amneziawg-tools/src/wg-quick/android.c
        find tunnel/tools/elf-cleaner -maxdepth 1 -type f | grep -Eq '\.(c|cpp)

    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "17"

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
      with:
        # The legacy "tools" package (part of the action's default) was removed
        # from Google's SDK repository; AGP downloads whatever else it needs.
        packages: platform-tools

    - name: Configure build
      id: cfg
      shell: bash
      run: |
        set -euo pipefail
        case "${{ inputs.target }}" in
          release_aab)
            echo "gradle_task=bundleRelease" >> "$GITHUB_OUTPUT"
            echo "kind=aab" >> "$GITHUB_OUTPUT"
            echo "artifact_name=release-aab" >> "$GITHUB_OUTPUT"
            echo "needs_signing=true" >> "$GITHUB_OUTPUT"
            echo "sign_mode=jarsigner" >> "$GITHUB_OUTPUT"
            ;;
          release_apk)
            echo "gradle_task=assembleRelease" >> "$GITHUB_OUTPUT"
            echo "kind=apk" >> "$GITHUB_OUTPUT"
            echo "artifact_name=release-apk" >> "$GITHUB_OUTPUT"
            echo "needs_signing=true" >> "$GITHUB_OUTPUT"
            echo "sign_mode=apksigner" >> "$GITHUB_OUTPUT"
            ;;
          debug_apk)
            echo "gradle_task=assembleDebug" >> "$GITHUB_OUTPUT"
            echo "kind=apk" >> "$GITHUB_OUTPUT"
            echo "artifact_name=debug-apk" >> "$GITHUB_OUTPUT"
            echo "needs_signing=false" >> "$GITHUB_OUTPUT"
            echo "sign_mode=none" >> "$GITHUB_OUTPUT"
            ;;
          *)
            echo "Unknown target: ${{ inputs.target }}" >&2
            exit 1
            ;;
        esac

    - name: Decode keystore from secret
      if: ${{ steps.cfg.outputs.needs_signing == 'true' }}
      shell: bash
      env:
        KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      run: |
        set -euo pipefail
        if [[ -z "${KEYSTORE_B64}" ]]; then
          echo "Missing secret ANDROID_KEYSTORE_BASE64" >&2
          exit 1
        fi
        echo "${KEYSTORE_B64}" | base64 --decode > release.keystore.jks
        echo "KEYSTORE_PATH=${PWD}/release.keystore.jks" >> "$GITHUB_ENV"

    - name: Build
      shell: bash
      run: |
        set -euo pipefail
        chmod +x ./gradlew
        ./gradlew --no-daemon --stacktrace ${{ steps.cfg.outputs.gradle_task }}

    - name: Locate built artifact
      id: locate
      shell: bash
      run: |
        set -euo pipefail
        
        if [[ "${{ steps.cfg.outputs.kind }}" == "aab" ]]; then
          FILE="./ui/build/outputs/bundle/release/ui-release.aab"
        elif [[ "${{ steps.cfg.outputs.sign_mode }}" == "apksigner" ]]; then
          FILE="./ui/build/outputs/apk/release/ui-release-unsigned.apk"
        else
          FILE="./ui/build/outputs/apk/debug/ui-debug.apk"
        fi
        
        if [[ ! -f "${FILE}" ]]; then
          echo "Built file not found: ${FILE}" >&2
          exit 1
        fi
        
        echo "built_file=${FILE}" >> "$GITHUB_OUTPUT"

    - name: Sign release artifact
      if: ${{ steps.cfg.outputs.needs_signing == 'true' }}
      id: sign
      shell: bash
      env:
        KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      run: |
        set -euo pipefail
        
        if [[ -z "${KEYSTORE_PASSWORD}" || -z "${KEY_ALIAS}" ]]; then
          echo "Missing one of secrets: ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS" >&2
          exit 1
        fi

        INPUT="${{ steps.locate.outputs.built_file }}"

        if [[ "${{ steps.cfg.outputs.sign_mode }}" == "jarsigner" ]]; then
          FINAL="${INPUT%.aab}-signed.aab"
          jarsigner \
            -keystore "${KEYSTORE_PATH}" \
            -storepass "${KEYSTORE_PASSWORD}" \
            -signedjar "${FINAL}" \
            "${INPUT}" \
            "${KEY_ALIAS}"
        elif [[ "${{ steps.cfg.outputs.sign_mode }}" == "apksigner" ]]; then
          FINAL="${INPUT%-unsigned.apk}-signed.apk"
          SDK_BUILD_TOOLS="${ANDROID_HOME}/build-tools/$(ls -1 "${ANDROID_HOME}/build-tools" | sort -V | tail -n1)"
          "${SDK_BUILD_TOOLS}/zipalign" -f -p 4 "${INPUT}" "${INPUT%.apk}-aligned.apk"
          mv "${INPUT%.apk}-aligned.apk" "${INPUT}"
          "${SDK_BUILD_TOOLS}/apksigner" sign \
            --ks "${KEYSTORE_PATH}" \
            --ks-pass "pass:${KEYSTORE_PASSWORD}" \
            --ks-key-alias "${KEY_ALIAS}" \
            --out "${FINAL}" \
            "${INPUT}"
          "${SDK_BUILD_TOOLS}/apksigner" verify --verbose "${FINAL}"
        else
          echo "Unknown sign mode" >&2
          exit 1
        fi

        echo "final_file=${FINAL}" >> "$GITHUB_OUTPUT"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.cfg.outputs.artifact_name }}
        path: ${{ steps.sign.outputs.final_file || steps.locate.outputs.built_file }}
        if-no-files-found: error

    - name: Publish build to GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: |
        set -euo pipefail

        FILE="${{ steps.sign.outputs.final_file || steps.locate.outputs.built_file }}"
        TAG="build-${{ github.run_number }}"

        if gh release view "${TAG}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
          gh release upload "${TAG}" "${FILE}" --repo "${{ github.repository }}" --clobber
        elif [[ "${{ inputs.target }}" == "debug_apk" ]]; then
          gh release create "${TAG}" "${FILE}" \
            --repo "${{ github.repository }}" \
            --title "AmneziaWG Payanag2 3 — Debug build #${{ github.run_number }}" \
            --notes "Automated debug APK build from ${{ inputs.ref || github.ref_name }}." \
            --prerelease
        else
          gh release create "${TAG}" "${FILE}" \
            --repo "${{ github.repository }}" \
            --title "AmneziaWG Payanag2 3 — ${{ inputs.target }} #${{ github.run_number }}" \
            --notes "Automated ${{ inputs.target }} build from ${{ inputs.ref || github.ref_name }}."
        fi


